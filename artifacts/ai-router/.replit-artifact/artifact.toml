kind = "web"
previewPath = "/"
title = "NVIDIA AI Router"
description = "A private AI routing dashboard for connecting model providers, managing encrypted provider credentials, and routing API requests through user-managed keys."
version = "1.0.0"
id = "artifacts/ai-router"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21689

[services.development]
run = "pnpm --filter @workspace/ai-router run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ai-router", "run", "build" ]
serve = "static"
publicDir = "artifacts/ai-router/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21689"
BASE_PATH = "/"
